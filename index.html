<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>עולם התורה — מערכת ניהול משרד</title>
    <script>
      // מוחל את ערכת העיצוב לפני שה-CSS והאפליקציה נטענים, כדי שלא תהיה הבזקה
      // של הערכה הלא-נכונה בכל טעינת עמוד. ר' src/lib/uiTheme.ts.
      (function () {
        try {
          var t = localStorage.getItem("olam-ui-theme");
          document.documentElement.setAttribute("data-ui", t === "v2" ? "v2" : "classic");
        } catch (e) {
          document.documentElement.setAttribute("data-ui", "classic");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
